.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo svg{display:block;flex:none}
.wm{font-family:'Archivo Black',system-ui,sans-serif;font-weight:400;line-height:1;letter-spacing:-.01em;color:transparent;display:inline-block;background-image:linear-gradient(transparent 0,transparent .4263em,#FF4A1C .4263em,#FF4A1C .4895em,transparent .4895em),repeating-linear-gradient(#14161A 0,#14161A .0421em,transparent .0421em,transparent .0632em);-webkit-background-clip:text;background-clip:text}

/* ---------- side rail ---------- */
#rail{width:300px;flex:none;height:100vh;overflow:auto;padding:24px 20px;border-right:1px solid var(--line);background:var(--surface)}
#rail h1{font-size:20px;line-height:28px;font-weight:700;display:flex;gap:8px;align-items:center;color:var(--brand)}
#rail p.sub{font-size:13px;line-height:18px;color:var(--ink2);margin:6px 0 16px}
#rail h2{font-size:14px;line-height:20px;font-weight:600;margin:20px 0 8px}
#rail .jb{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r12);border:1px solid var(--line);margin-bottom:8px;background:var(--bg-app)}
#rail .jb b{display:block;font-size:14px;line-height:20px;font-weight:600}
#rail .jb span{display:block;font-size:13px;line-height:18px;color:var(--ink2)}
#rail .jb:hover{border-color:var(--brand);background:var(--tint)}
#rail .screens{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#rail .screens button{font-size:13px;line-height:18px;text-align:left;padding:8px 10px;border-radius:var(--r8);border:1px solid var(--line)}
#rail .screens button.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
#rail .lang{display:flex;gap:6px}
#rail .lang button{flex:1;padding:10px;border-radius:var(--pill);border:1px solid var(--line);font-size:14px;font-weight:600}
#rail .lang button.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
#rail .restart{margin-top:16px;width:100%;padding:12px;border-radius:var(--pill);border:1px solid var(--line);font-size:14px;font-weight:600;display:flex;justify-content:center;gap:8px;align-items:center}

/* ---------- stage + phone ---------- */
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
#scaler{transform-origin:center center;flex:none}
#phone{width:412px;height:892px;background:var(--bg-app);border-radius:36px;border:10px solid #1d2a28;box-sizing:content-box;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #0002}
.status{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:15px;line-height:18px;font-weight:600}
.status .conn{display:flex;gap:6px;align-items:center}
.hdr{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px}
.hdr h2{flex:1;font-size:20px;line-height:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:48px;height:48px;border-radius:var(--pill);display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.ibtn:active{background:var(--tint)}
.hdr .ibtn.ghost{background:none;border:0}
.page{flex:1;overflow-y:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.page>*{flex-shrink:0}
.nav{height:80px;flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:0;padding:8px 20px;justify-content:space-between}
.nav button{width:124px;height:64px;border-radius:var(--pill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;line-height:18px;font-weight:600;color:var(--ink2)}
.nav button.on{background:var(--tint);color:var(--brand)}
.grest{height:24px;flex:none;display:grid;place-items:center}
.grest i{display:block;width:112px;height:4px;border-radius:4px;background:var(--ink)}

/* ---------- type ---------- */
.display{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.2px}
.h1{font-size:24px;line-height:32px;font-weight:700}
.h2{font-size:20px;line-height:28px;font-weight:700}
.h3{font-size:18px;line-height:26px;font-weight:600}
.bl{font-size:16px;line-height:24px}
.bm{font-size:14px;line-height:20px}
.ll{font-size:16px;line-height:24px;font-weight:600}
.lm{font-size:14px;line-height:20px;font-weight:600}
.cap{font-size:13px;line-height:18px}
.sec{color:var(--ink2)}
body.hi .bl,body.hi .bm,body.hi .cap{line-height:1.7}

/* ---------- components ---------- */
.btn{min-height:56px;width:100%;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;font-size:16px;font-weight:600;border:2px solid transparent;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--on)}
.btn.primary:active{background:#0d5046}
.btn.secondary{background:var(--bg-app);color:var(--brand);border-color:var(--brand)}
.btn.danger{background:var(--danger);color:var(--on)}
.btn.text{min-height:48px;color:var(--brand);background:none}
.btn.m{min-height:48px;font-size:14px}
.btn[disabled]{background:var(--dis-bg);color:var(--dis-tx);border-color:transparent;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r16);padding:16px}
.card.tint{background:var(--tint);border-color:var(--tint-b)}
.card.high{background:var(--danger-t);border-color:#e9b9b5}
.card.med{background:var(--warn-t);border-color:#ecd49a}
.card.muted{background:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack8{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--pill);font-size:13px;line-height:18px;font-weight:600;background:var(--muted);color:var(--ink2)}
.badge.high{background:var(--danger-t);color:var(--danger)}
.badge.med{background:var(--warn-t);color:var(--warn)}
.badge.ok{background:var(--tint);color:var(--brand)}
.dot{width:40px;height:40px;border-radius:var(--pill);display:grid;place-items:center;flex:none;background:var(--muted);color:var(--ink2)}
.dot.high{background:var(--danger-t);color:var(--danger)}
.dot.ok{background:var(--tint);color:var(--brand)}
.dot.med{background:var(--warn-t);color:var(--warn)}
.ini{width:48px;height:48px;border-radius:var(--pill);display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--tint);color:var(--brand);flex:none}
.ini.pend{background:var(--muted);color:var(--ink2)}
.sw{width:52px;height:32px;border-radius:var(--pill);background:var(--dis-bg);position:relative;flex:none;transition:background .15s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0003;transition:transform .15s}
.sw.on{background:var(--brand);border-color:var(--brand)}
.sw.on::after{transform:translateX(20px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{height:40px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.seg{display:flex;background:var(--muted);border-radius:var(--pill);padding:4px}
.seg button{flex:1;height:44px;border-radius:var(--pill);font-weight:600;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px #0002}
.link{color:var(--brand);font-weight:600;font-size:14px;line-height:20px;min-height:48px;display:inline-flex;align-items:center;gap:4px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r16)}
.item:active{background:var(--tint)}
.field{display:flex;align-items:center;height:56px;border:2px solid var(--line);border-radius:var(--r12);background:var(--surface);padding:0 16px;gap:10px}
.field:focus-within{border-color:var(--brand)}
.field.err{border-color:var(--danger)}
.field input{flex:1;border:0;outline:0;background:none;font-size:18px;font-weight:600;min-width:0;color:var(--ink)}
.field input::placeholder{color:var(--dis-tx);font-weight:400}
.note{font-size:13px;line-height:18px;color:var(--ink2);display:flex;gap:8px;align-items:flex-start}
.check{width:28px;height:28px;border-radius:var(--r8);border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on)}
.check.on{background:var(--brand);border-color:var(--brand)}
hr{border:0;border-top:1px solid var(--line)}

/* ---------- dashboard ---------- */
.eyebrow{font-size:13px;line-height:18px;font-weight:600;letter-spacing:.3px;color:var(--ink2)}
.hero{background:linear-gradient(155deg,#14766A 0%,#0B4A41 100%);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#ffffff26,#ffffff00 70%);pointer-events:none}
.hero .eyebrow{color:#CFE7DF}
.hero>*{position:relative}
.ring{position:relative;width:72px;height:72px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700}
.rarc{animation:rdraw .8s ease-out}
@keyframes rdraw{from{stroke-dashoffset:var(--c)}}
.ring b svg{transform:none}
.hl{border-color:#e9b9b5;background:var(--danger-t)}
.hnum{font-size:26px;font-weight:800;color:var(--danger);letter-spacing:.5px}
.hlink{display:flex;align-items:flex-start;gap:10px;color:var(--brand);text-decoration:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-app)}
.hlink b{font-size:15px;text-decoration:underline}
a.btn{text-decoration:none;display:flex}
.wk{display:flex;flex-direction:column;gap:14px;padding:16px;background:linear-gradient(155deg,#14766A 0%,#0B4A41 100%);border-color:transparent;color:#fff}
.wk .h3{color:#fff}
.wkt{font-size:12px;font-weight:600;color:#fff;background:#ffffff26;padding:4px 10px;border-radius:var(--pill)}
.wkg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wkc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#ffffff1f;border:1px solid #ffffff26;border-radius:16px;padding:12px;color:#fff}
.wkc:active,.wkf:active{background:#ffffff38}
.wkc .dot{width:36px;height:36px;margin-bottom:6px;background:#ffffff29;color:#fff}
.wkc b{font-size:28px;line-height:32px;font-weight:700;color:#fff}
.wkc>span:last-child{font-size:13px;line-height:18px;color:#D8EBE5}
.wkc.hi{background:var(--danger-t);border-color:#e9b9b5}
.wkc.hi .dot{background:#fff;color:var(--danger)}
.wkc.hi b{color:var(--danger)}
.wkc.hi>span:last-child{color:var(--danger)}
.wkf{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-top:1px solid #ffffff33;padding:12px 0 0;font-size:15px;color:#fff}
.wkf .dot{background:#ffffff29;color:#fff}
.wkf b{font-weight:700}
@media (prefers-reduced-motion:reduce){.rarc{animation:none}}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hstats div{background:#ffffff1f;border-radius:12px;padding:10px 12px}
.hstats b{display:block;font-size:22px;line-height:28px;font-weight:700}
.hstats span{display:block;font-size:13px;line-height:16px;color:#D8EBE5}
.btn.light{background:#fff;color:var(--brand)}
.btn.light:active{background:var(--tint)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa .card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;text-align:center}
.qa .card:active{background:var(--tint)}
.sect{display:flex;align-items:flex-end;gap:12px}
.sub{font-size:13px;line-height:18px;color:var(--ink2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #12685B66}70%{box-shadow:0 0 0 8px #12685B00}100%{box-shadow:0 0 0 0 #12685B00}}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:18px;background:linear-gradient(180deg,#fff,#F4FAF7);border-color:var(--tint-b)}
.feat:active{background:var(--tint)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scroll-snap-type:x mandatory;scroll-padding:0 20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pb{flex:none;width:176px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:14px}
.pb:active{background:var(--tint)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:var(--r12);background:var(--surface)}
.opt:not([disabled]):active{background:var(--tint)}
.opt .ol{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700;background:var(--muted);color:var(--ink2)}
.opt.ok{border-color:var(--brand);background:var(--tint);color:var(--brand)}
.opt.ok .ol{background:var(--brand);color:#fff}
.opt.bad{border-color:var(--danger);background:var(--danger-t);color:var(--danger)}
.opt.bad .ol{background:var(--danger);color:#fff}
.opt[disabled]{cursor:default}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.gstats b{display:block;font-size:19px;line-height:26px;font-weight:700;color:var(--brand)}
.gstats span{display:block;font-size:13px;line-height:17px;color:var(--ink2)}
a.link{text-decoration:none}
.ph{flex:1;min-height:300px;border:2px dashed var(--tint-b);border-radius:28px;background:linear-gradient(160deg,#F2FAF6,#E4F2EB);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;color:var(--brand)}
.ph .sec{color:var(--ink2);max-width:240px}
.ph-ic{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:6px;box-shadow:0 1px 3px #0001}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{display:block;width:8px;height:8px;border-radius:8px;background:var(--line);transition:width .2s}
.dots i.on{width:28px;background:var(--brand)}

/* ---------- overlays ---------- */
.scrim{position:absolute;inset:0;background:#172E2C66;display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sheet{width:100%;background:var(--surface);border-radius:var(--r24) var(--r24) 0 0;padding:12px 20px 28px;display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out;max-height:80%;overflow:auto}
.sheet>*{flex-shrink:0}
.sheet .grab{width:44px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.toast{position:absolute;left:20px;right:20px;bottom:112px;z-index:30;background:var(--ink);color:var(--on);border-radius:var(--r16);padding:14px 16px;display:flex;gap:10px;align-items:center;font-size:14px;line-height:20px;font-weight:500;animation:up .25s ease-out}
.center{text-align:center;align-items:center}
.big{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.spin{animation:spin 1s linear infinite}
.screen-in{animation:slide .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
/* ---------- glass-morphism alerts ---------- */
.gl{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;color:#fff;
 background:radial-gradient(120% 55% at 85% 8%,#1E7A6C66,#0000 60%),radial-gradient(90% 50% at 8% 92%,#2FA38E3D,#0000 65%),linear-gradient(180deg,#0F2B28 0%,#0C3B35 55%,#0F2B28 100%)}
.gl :focus-visible{outline-color:#fff}
.gl-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.gl-body{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:0 20px 12px;scrollbar-width:none}
.gl-body::-webkit-scrollbar{display:none}
.gl-top{height:56px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;line-height:20px;font-weight:600;color:#E3F1EC}
.gl-ring{display:block;width:20px;height:20px;border-radius:50%;border:2px solid #ffffff66}
.glass{position:relative;flex:none;border-radius:var(--r24);padding:20px;display:flex;flex-direction:column;gap:12px;
 background:linear-gradient(135deg,#ffffff3d,#ffffff17);
 -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
 border:1px solid #ffffff4d;box-shadow:0 12px 40px #00000059,inset 0 1px 0 #ffffff59}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:#16403Bf2}}
.glass .gtag{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;font-weight:700;letter-spacing:.3px}
.glass .gtag.high{color:#FFB9B3}
.glass .gtag.med{color:#FFD98A}
.glass h2{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.2px;color:#fff}
.glass .gp{font-size:16px;line-height:24px;color:#F2FAF7}
.glass .gs{font-size:13px;line-height:18px;color:#D3E8E1;border-top:1px solid #ffffff2e;padding-top:12px}
body.hi .glass .gp,body.hi .glass .gs{line-height:1.7}
.gl-avatar{position:absolute;left:50%;top:300px;width:176px;height:176px;margin-left:-88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8CC2B5,#2D6B60 60%,#173F39);filter:blur(10px);opacity:.6}
.gl-actions{display:flex;justify-content:space-around;padding:8px 0 4px;flex:none}
.gl-circ{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;line-height:18px;color:#E3F1EC}
.gl-circ i{width:68px;height:68px;border-radius:50%;border:1px solid #ffffff59;display:grid;place-items:center;background:#ffffff10}
.gl-chat{display:flex;flex-direction:column;gap:10px;padding:76px 20px 0}
.gl-bub{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:20px;background:#ffffff24;color:#EAF5F1;align-self:flex-start}
.gl-bub.me{align-self:flex-end;background:#1C7C6D99}
.gl-input{flex:none;height:48px;border-radius:24px;background:#ffffff1f;display:flex;align-items:center;padding:0 18px;color:#C4DCD5;font-size:14px}

/* ---------- contact tags, family tiles, KPI + community ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:2px 10px;border-radius:var(--pill);font-size:13px;line-height:18px;font-weight:600;background:var(--tint);color:var(--brand);border:1px solid var(--tint-b);max-width:100%}
.ffc{flex:none;width:112px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;text-align:center}
.ffc:active{background:var(--tint)}
.ffc.add{border-style:dashed;border-color:var(--tint-b);justify-content:center;gap:8px}
.hstats.k4{grid-template-columns:repeat(2,1fr)}
.hstats button{display:block;text-align:left;color:#fff;background:#ffffff1f;border-radius:12px;padding:10px 12px}
.hstats button:active{background:#ffffff38}
.hero :focus-visible{outline-color:#fff}

/* ---------- login sheet: OTP boxes + SMS banner ---------- */
.scrim.noanim,.scrim.noanim .sheet{animation:none}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp b{height:56px;border:2px solid var(--line);border-radius:var(--r12);display:grid;place-items:center;font-size:22px;line-height:28px;font-weight:700;background:var(--surface);color:var(--ink);transition:border-color .12s,background .12s}
.otp b.f{background:var(--tint);border-color:var(--tint-b)}
.otp:focus-within b.on{border-color:var(--brand);background:var(--surface)}
.otp.err b{border-color:var(--danger);background:var(--danger-t)}
.otp.err{animation:shake .32s}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:none;font-size:16px;cursor:text}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.sms{position:absolute;left:12px;right:12px;top:48px;z-index:40;display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px #172E2C47;animation:drop .38s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-130%);opacity:0}to{transform:none;opacity:1}}

/* ---------- grouped settings ---------- */
.jump{position:sticky;top:-16px;z-index:5;margin:-16px -20px 0;padding:12px 20px;background:var(--bg-app);border-bottom:1px solid var(--line)}
.grp{display:flex;flex-direction:column;gap:10px;scroll-margin-top:72px}
.grp-h{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px;line-height:18px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:0 4px}
.grp-h svg{color:var(--brand)}
.grp-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r16);overflow:hidden}
.grp-card .item{border:0;border-radius:0;border-top:1px solid var(--line);background:none}
.grp-card>.item:first-child,.grp-card>.pf+.item{border-top:0}
.grp-card .item:active{background:var(--tint)}
.pf{display:flex;align-items:center;gap:12px;padding:16px}
.pf .ini{width:52px;height:52px;font-size:17px}
.pf.empty .ini{background:var(--muted);color:var(--ink2)}
.grp-note{font-size:13px;line-height:18px;color:var(--ink2);padding:0 4px}
/* ---------- in-call popover alerts ---------- */
.pop{touch-action:none;will-change:transform;position:absolute;left:12px;right:12px;top:50px;z-index:25;animation:drop .4s cubic-bezier(.2,.8,.2,1)}
.pop .glass{padding:18px;gap:10px;box-shadow:0 16px 48px #0000008c,inset 0 1px 0 #ffffff59;
 background:linear-gradient(135deg,#ffffff30,#ffffff0b);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
 touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pop.drag .glass{cursor:grabbing;box-shadow:0 24px 60px #000000a6,inset 0 1px 0 #ffffff59}
.pop .grabber{width:40px;height:4px;border-radius:2px;background:#ffffff80;align-self:center;margin:-6px 0 2px}
.pop .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pop .glass h2{font-size:24px;line-height:32px}
.pop .gp{font-size:15px;line-height:22px}
button.gl-circ{background:none;border:0}
button.gl-circ.on i{background:#fff;color:#0F2B28}
.gl-endwrap{padding:4px 0 8px;flex:none}
/* ---------- light call screen + light popover ---------- */
.gl-sub{color:#D3E8E1}.gl-note{color:#C4DCD5}
.gl-foot{display:flex;align-items:center;gap:12px}.gl-theme{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff59;background:#ffffff1a;color:#fff;display:grid;place-items:center}
.gl.light{color:var(--ink);background:radial-gradient(120% 55% at 85% 6%,#BFE3D8B3,#0000 60%),radial-gradient(90% 50% at 6% 94%,#CDEBDD99,#0000 65%),linear-gradient(180deg,#FFFFFF 0%,#F2F8F5 100%)}
.gl.light :focus-visible{outline-color:var(--brand)}
.gl.light .gl-top{color:var(--ink2)}
.gl.light .gl-sub,.gl.light .gl-note{color:var(--ink2)}
.gl.light .gl-theme{border-color:var(--line);background:#fff;color:var(--ink)}
.gl.light .gl-circ{color:var(--ink2)}
.gl.light .gl-circ i{border-color:var(--line);background:#fff;box-shadow:0 1px 2px #172E2C14}
.gl.light button.gl-circ.on i{background:var(--ink);color:#fff;border-color:var(--ink)}

   <div class="field"><input id="invtag" value="${S.inv.tag||''}" maxlength="20" autocomplete="off" placeholder="${L('e.g. Mother, Friend, Neighbour','जैसे माँ, दोस्त, पड़ोसी')}"></div>

  ${btn(S.editIdx!=null?L('Save changes','बदलाव सहेजें'):L('Add to list','सूची में जोड़ें'),'doinvite',{i:S.editIdx!=null?'check':'user-round-plus'})}${btn(L('Cancel','रद्द करें'),'closeov',{k:'secondary'})}`),

  <p class="bm sec">${L('Other Skan8 users can be warned about scams you flag. Nothing is shared until you confirm.','आपके फ़्लैग किए स्कैम के बारे में अन्य Skan8 उपयोगकर्ताओं को चेताया जा सकता है। पुष्टि तक कुछ साझा नहीं होता।')}</p>
  <div class="card muted stack8"><div class="lm">${L('What can be shared','क्या साझा हो सकता है')}</div>

   <div class="row" style="align-items:flex-start;gap:10px"><span style="color:var(--brand);margin-top:2px">${ic('message-circle',16)}</span><span class="bm"><b>${L('Messages','संदेश')}</b> · ${L('the sender and link of a message you flag','आपके फ़्लैग किए संदेश का भेजने वाला और लिंक')}</span></div>
   <div class="row" style="align-items:flex-start;gap:10px"><span style="color:var(--brand);margin-top:2px">${ic('key-round',16)}</span><span class="bm"><b>${L('OTP requests','OTP अनुरोध')}</b> · ${L('that a code was asked for, and by which number','कि कोड मांगा गया, और किस नंबर से')}</span></div></div>
  <div class="card tint stack8" style="gap:4px"><div class="lm" style="color:var(--brand)">${L('Never shared','कभी साझा नहीं')}</div><p class="bm">${L('Your name, your contacts, private chats, or the OTP code itself.','आपका नाम, आपके संपर्क, निजी चैट या OTP कोड।')}</p></div>
  <p class="cap sec">${L('You can turn this off any time in Protection settings.','आप इसे कभी भी सुरक्षा सेटिंग में बंद कर सकते हैं।')}</p>
  ${btn(L('Turn on sharing','शेयरिंग चालू करें'),'communityon',{i:'users-round'})}${btn(L('Not now','अभी नहीं'),'closeov',{k:'secondary'})}`),

 editName:()=>sheet(`<h2 class="h2">${S.uname?L('Edit your name','अपना नाम बदलें'):L('Add your name','अपना नाम जोड़ें')}</h2><p class="bm sec">${L('Skan8 uses it to greet you. It is not shared with anyone.','Skan8 इसे आपका स्वागत करने के लिए उपयोग करता है। यह किसी से साझा नहीं होता।')}</p><div class="stack8"><label class="lm" for="unamein">${L('Your name','आपका नाम')}</label><div class="field"><input id="unamein" value="${S.nameDraft.replace(/"/g,'&quot;')}" maxlength="30" autocomplete="given-name" placeholder="${L('e.g. Govind','जैसे गोविंद')}"></div></div>${btn(L('Save','सहेजें'),'savename',{i:'check'})}${S.uname?`<button class="btn text" data-act="clearname">${L('Remove name','नाम हटाएं')}</button>`:''}${btn(L('Cancel','रद्द करें'),'closeov',{k:'secondary'})}`),
 login:loginOverlay
};

/* ===== Render + router ===== */
const phone=document.getElementById('phone');
function render(keepScroll){
 const pg=phone.querySelector('.page'),top=pg?pg.scrollTop:0;
 let h=SC[S.scr]();
 if(S.ov)h+=OV[S.ov]();
 if(S.toast)h+=`<div class="toast" role="status">${ic('circle-check',20)}<span>${S.toast}</span></div>`;
 phone.innerHTML=`<div style="display:flex;flex-direction:column;height:100%;position:relative">${h}</div>`;
 if(S.scr==='01'||S.scr==='01b'){phone.firstElementChild.style.background=S.scr==='01'?'#F7F3EB':'#F7F2E8'}
 if(S.scr==='04'){phone.querySelector('.status').style.color='#fff';phone.querySelector('.grest i').style.background='#fff';phone.firstElementChild.style.background='var(--ink)'}
 if(GLASS.includes(S.scr)){const lt=S.scr==='05'&&S.callLight;phone.querySelector('.status').style.color=lt?'var(--ink)':'#fff';phone.querySelector('.grest i').style.background=lt?'var(--ink)':'#fff';phone.firstElementChild.style.background=lt?'#fff':'#0F2B28'}
 document.body.classList.toggle('hi',S.lang==='hi');
 if(keepScroll){const p=phone.querySelector('.page');if(p)p.scrollTop=top}
 rail();
}
function go(id,opt={}){
 let [sid,mode]=String(id).split(':');
 if(sid==='05'&&!opt.back)S.call={t:0,fired:{},active:null};
 if(mode)S.sosMode=mode;
 if(!opt.back&&S.scr!==sid)S.stack.push(S.scr);
 if(sid==='07'&&!opt.keepFilter)S.filter=opt.filter||'All';
 S.scr=sid;S.ov=null;S.editing=false;render();
}
function back(){const p=S.stack.pop();if(p)go(p,{back:1,keepFilter:1});else go('03',{back:1})}
function toast(m){S.toast=m;clearTimeout(S.tout);S.tout=setTimeout(()=>{S.toast=null;const t=phone.querySelector('.toast');if(t)t.remove()},2600);render(true)}
function openInc(inc,from,end){if(from==='05')S.call.active=null;S.inc=inc;S.origin=from;go('06')}
function fail(){S.sosFail=true}

const PROT=[['call','calls','phone',['Call alerts','कॉल अलर्ट'],['Warns about unknown callers','अनजान कॉल करने वालों के बारे में चेताता है']],
 ['link','shared','link',['Links & shared messages','लिंक और साझा संदेश'],['Checks content you choose to share','आपकी साझा सामग्री जांचता है']],
 ['notif','notif','bell',['Notifications','सूचनाएं'],['Shows warnings when they matter','ज़रूरी होने पर चेतावनी दिखाता है']]];
const protOn=()=>PROT.filter(p=>S.set[p[0]]).length;
function setProt(k,v){S.set[k]=v;const p=PROT.find(x=>x[0]===k);if(p)S.perm[p[1]]=v}
const ACT={
 protall(){PROT.forEach(p=>setProt(p[0],true));toast(L('Preview · your phone will ask for each permission.','प्रीव्यू · आपका फोन हर अनुमति पूछेगा।'))},
 back,
 calltheme(){S.callLight=!S.callLight;render(true)},
 popdismiss(){S.call.active=null;S.call.pos=null;render(true)},
 warnfam(){S.call.active=null;S.call.pos=null;go('15:warn')},
 lang(){S.lang=S.lang==='en'?'hi':'en';render(true)},
 closeov(){clearInterval(lgTimer);S.ov=null;render(true)},
 call1930(){toast(L('Preview · this would open your phone’s dialer for 1930.','पूर्वावलोकन · यह आपके फोन का डायलर 1930 के लिए खोलेगा।'))},
 qnext(){if(S.q===QZ.length-1){S.q=0;S.qs=0}else S.q++;S.qa=null;render(true)},
 decline(){S.stack=[];go('07');toast(L('Call declined and logged','कॉल अस्वीकार और दर्ज'))},
 answer(){go('05')},
 doblock(){S.blocked[S.inc]=true;S.ov='blocked';render(true)},
 doreport(){S.ov='reported';render(true)},
 finish07(){S.ov=null;S.stack=['03'];go('07',{back:1})},
 finish14(){S.ov=null;S.stack=['03'];go('14',{back:1})},
 dosend(){S.ov=S.sosFail?'failed':'sent';render(true)},
 simfail(){S.sosFail=true;S.ov='failed';render(true)},
 editmsg(){const t=document.getElementById('msgin');if(t)S.msg=t.value||S.msg;S.editing=!S.editing;render(true)},
 async pickcontact(){try{if(navigator.contacts&&navigator.contacts.select){const r=await navigator.contacts.select(['name','tel'],{multiple:false});if(r&&r[0]){const c=r[0];S.inv.name=(c.name&&c.name[0])||'';S.inv.num=((c.tel&&c.tel[0])||'').replace(/\D/g,'').slice(-10)}S.ov='addContact';render(true);return}}catch(e){}S.ov='pickContact';render(true)},
 backinvite(){S.ov='addContact';render(true)},
 invite(){},
 doinvite(){const n=S.inv.name.trim(),p=S.inv.num;if(!n||p.length!==10){toast(L('Enter a name and a 10-digit number.','नाम और 10 अंकों का नंबर डालें।'));return}
  const tg=(S.inv.tag||'').trim();
  if(S.editIdx!=null){const c=S.contacts[S.editIdx];if(c.n!==n&&S.rec[c.n]!==undefined){S.rec[n]=S.rec[c.n];delete S.rec[c.n]}Object.assign(c,{i:initials(n),n,num:p,tag:tg});S.editIdx=null;S.ov=null;S.inv={name:'',num:'',tag:''};toast(L('Contact updated.','संपर्क अपडेट किया गया।'))}
  else{S.contacts.push({i:initials(n),n,num:p,tag:tg});S.ov=null;S.inv={name:'',num:'',tag:''};toast(L('Added to your trusted contacts.','आपके भरोसेमंद संपर्कों में जोड़ा गया।'))}},
 agree(){S.agree=!S.agree;render(true)},
 openlogin(){if(S.user){go('02');return}S.login=newLogin('onboarding');S.ov='login';render(true);focusLg()},
 loginsettings(){S.login=newLogin('settings');S.ov='login';render(true);focusLg()},
 skiplogin(){clearInterval(lgTimer);S.ov=null;go('02')},
 sendotp(){const g=S.login;if(!lgValid(g.num))return;g.loading=true;render(true);
  setTimeout(()=>{if(S.ov!=='login'||S.login!==g)return;g.loading=false;g.step='otp';g.otp='';g.err=null;g.t=30;g.sms=false;render(true);focusLg();startLg();arriveSms()},900)},
 lgback(){const g=S.login;g.step='phone';g.otp='';g.err=null;g.sms=false;clearInterval(lgTimer);render(true);focusLg()},
 fillotp(){const g=S.login;g.otp=DEMO_OTP;g.sms=false;g.err=null;render(true);focusLg()},
 resend(){const g=S.login;g.otp='';g.err=null;g.t=30;g.sms=false;render(true);focusLg();startLg();arriveSms()},
 verifyotp(){const g=S.login;if(g.otp.length!==6)return;
  if(g.otp!==DEMO_OTP){g.err='otp';g.sms=false;render(true);focusLg();return}
  g.loading=true;g.err=null;g.sms=false;render(true);
  setTimeout(()=>{if(S.login!==g||S.ov!=='login')return;clearInterval(lgTimer);S.user={phone:g.num};g.loading=false;S.ov=null;
   if(g.from==='onboarding')go('02');else render(true);
   toast(L('Logged in as','लॉग इन:')+' '+lgFmt(g.num))},900)},
 demoscam(){ACT._demo('scam')},demootp(){ACT._demo('otp')},demopay(){ACT._demo('pay')},
 demoall(){S.ov=null;go('05')},
 _demo(k){S.ov=null;startCall(k)},
 editname(){S.nameDraft=S.uname;S.ov='editName';render(true);setTimeout(()=>{const i=document.getElementById('unamein');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},0)},
 savename(){const v=(document.getElementById('unamein')?.value||S.nameDraft).trim();if(!v){toast(L('Enter a name to save.','सहेजने के लिए नाम डालें।'));return}S.uname=v;S.ov=null;toast(L('Name saved.','नाम सहेजा गया।'))},
 clearname(){S.uname='';S.ov=null;toast(L('Name removed.','नाम हटाया गया।'))},
 logout(){S.user=null;toast(L('Logged out.','लॉग आउट हो गए।'))},
 communityon(){S.set.community=true;S.ov=null;toast(L('Community sharing is on. You can turn it off any time.','कम्युनिटी शेयरिंग चालू है। आप इसे कभी भी बंद कर सकते हैं।'))},
 check(){
  const v=S.num;
  if(v.length!==10){S.numState='error';render(true);return}
  S.numState='loading';render(true);
  setTimeout(()=>{if(S.scr!=='11')return;S.numRes=S.sample||(v.startsWith('98765')?'scam':v.startsWith('00000')?'unk':'none');S.numState='result';render(true)},1000);
 }
};

phone.addEventListener('click',e=>{
 if(e.target.dataset&&e.target.dataset.scrim){ACT.closeov();return}
 const t=e.target.closest('[data-act],[data-go],[data-nav],[data-open],[data-ov],[data-sw],[data-tg],[data-filter],[data-tip],[data-lang],[data-rec],[data-mode],[data-sample],[data-pc],[data-feed],[data-news],[data-learn],[data-qa],[data-tag],[data-edit],[data-jump],[data-prot],[data-sosto]');
 if(!t)return;
 if(t.dataset.prot){const k=t.dataset.prot;setProt(k,!S.set[k]);render(true);return}
 if(t.dataset.jump){const el=document.getElementById(t.dataset.jump);if(el)el.scrollIntoView({block:'start',behavior:'smooth'});return}
 if(t.dataset.act&&t.dataset.act.startsWith('perm:')){const k=t.dataset.act.slice(5);S.perm[k]=!S.perm[k];S.set.call=S.perm.calls;S.set.link=S.perm.shared;S.set.notif=S.perm.notif;render(true);return}
 if(t.dataset.act){const f=ACT[t.dataset.act];if(f)f();return}
 if(t.dataset.nav){S.stack=[];go(t.dataset.nav);return}
 if(t.dataset.open){if(t.dataset.end)S.callEnded=true;openInc(t.dataset.open,t.dataset.from);return}
 if(t.dataset.ov){if(t.dataset.ov==='addContact'){S.editIdx=null;S.inv={name:'',num:'',tag:''}}S.ov=t.dataset.ov;render(true);return}
 if(t.dataset.sw&&t.dataset.sw.startsWith('perm:')){const k=t.dataset.sw.slice(5);S.perm[k]=!S.perm[k];S.set.call=S.perm.calls;S.set.link=S.perm.shared;S.set.notif=S.perm.notif;render(true);return}
 if(t.dataset.sw==='community'){if(S.set.community){S.set.community=false;toast(L('Community sharing turned off.','कम्युनिटी शेयरिंग बंद की गई।'))}else{S.ov='communityConfirm';render(true)}return}
 if(t.dataset.sw){const k=t.dataset.sw;if(k==='loc')S.loc=!S.loc;else{S.set[k]=!S.set[k];if(k==='call')S.perm.calls=S.set.call;if(k==='link')S.perm.shared=S.set.link;if(k==='notif')S.perm.notif=S.set.notif}render(true);return}
 if(t.dataset.tg){S[t.dataset.tg]=!S[t.dataset.tg];render(true);return}
 if(t.dataset.filter&&!t.dataset.go){S.filter=t.dataset.filter;render(true);return}
 if(t.dataset.tip){const i=+t.dataset.tip;S.tip=S.tip===i?-1:i;render(true);return}
 if(t.dataset.lang){S.lang=t.dataset.lang;render(true);return}
 if(t.dataset.rec){S.rec[t.dataset.rec]=!S.rec[t.dataset.rec];render(true);return}
 if(t.dataset.sosto){S.sosTo=t.dataset.sosto;S.ov='callConfirm';render(true);return}
 if(t.dataset.mode){S.sosMode=t.dataset.mode;render(true);return}
 if(t.dataset.sample){S.num=t.dataset.sample;S.sample=t.dataset.r;S.numState='empty';render(true);ACT.check();return}
 if(t.dataset.feed){S.feed=t.dataset.feed;render(true);return}
 if(t.dataset.news!==undefined){S.newsI=+t.dataset.news;S.ov='news';render(true);return}
 if(t.dataset.learn!==undefined){S.learnI=+t.dataset.learn;S.ov='learn';render(true);return}
 if(t.dataset.qa!==undefined){if(S.qa===null){S.qa=+t.dataset.qa;if(S.qa===QZ[S.q].c)S.qs++}render(true);const qn=phone.querySelector('.qnote');if(qn)qn.scrollIntoView({block:'nearest',behavior:'smooth'});return}
 if(t.dataset.edit!==undefined){const i=+t.dataset.edit,c=S.contacts[i];S.editIdx=i;S.inv={name:c.n,num:c.num||'',tag:c.tag?tagTxt(c.tag):''};S.ov='addContact';render(true);return}
 if(t.dataset.tag!==undefined){S.inv.tag=(S.inv.tag||'').trim().toLowerCase()===t.dataset.tag.toLowerCase()?'':t.dataset.tag;render(true);return}
 if(t.dataset.pc!==undefined){const c=CONTACTS[+t.dataset.pc];S.inv={...S.inv,name:c[0],num:c[1]};S.ov='addContact';render(true);return}
 if(t.dataset.go){const fs=t.dataset.filterSet;go(t.dataset.go,{filter:fs});return}
});
phone.addEventListener('input',e=>{
 if(e.target.id==='numin'){const v=e.target.value.replace(/\D/g,'').slice(0,10);e.target.value=v;S.num=v;S.sample=null;if(S.numState!=='empty'){S.numState='empty';render(true);const i=document.getElementById('numin');i.focus();i.setSelectionRange(v.length,v.length)}}
 if(e.target.id==='unamein')S.nameDraft=e.target.value;
 if(e.target.id==='msgin')S.msg=e.target.value;
 if(e.target.id==='invname')S.inv.name=e.target.value;
 if(e.target.id==='invtag')S.inv.tag=e.target.value;
 if(e.target.id==='lgnum'){const v=e.target.value.replace(/\D/g,'').slice(0,10);e.target.value=v;S.login.num=v;lgSync()}
 if(e.target.id==='otpin'){const v=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=v;S.login.otp=v;S.login.err=null;otpSync()}
 if(e.target.id==='invnum'){const v=e.target.value.replace(/\D/g,'').slice(0,10);e.target.value=v;S.inv.num=v}
});
phone.addEventListener('keydown',e=>{if(e.target.id==='numin'&&e.key==='Enter')ACT.check();if(e.target.id==='unamein'&&e.key==='Enter')ACT.savename();if(e.target.id==='lgnum'&&e.key==='Enter')ACT.sendotp();if(e.target.id==='otpin'&&e.key==='Enter')ACT.verifyotp();if(e.key==='Escape'&&S.ov)ACT.closeov()});

/* ===== Prototype rail ===== */
const JOUR=[
 ['A','Get started','01 → 01b → 01c → 02 → 03',()=>{reset();}],
 ['B','Scam call → block','03 → 04 → 06 → confirm → 07',()=>{reset('03');go('04')}],
 ['B2','Active call (auto alerts)','05 → 3 alerts over ~17s → End call',()=>{reset('03');go('05')}],
 ['B3','Alert: scammer on call','05 popover · caller flagged',()=>{reset('03');startCall('scam')}],
 ['B4','Alert: bank OTP on call','05 popover · OTP received',()=>{reset('03');startCall('otp')}],
 ['B5','Alert: payment link','05 popover · link shared',()=>{reset('03');startCall('pay')}],
 ['B6','Light · scammer alert','05 popover · white background',()=>{reset('03');S.callLight=true;startCall('scam')}],
 ['B7','Light · bank OTP alert','05 popover · white background',()=>{reset('03');S.callLight=true;startCall('otp')}],
 ['B8','Light · payment link alert','05 popover · white background',()=>{reset('03');S.callLight=true;startCall('pay')}],
 ['C','Risky link','08 → 06 → report',()=>{reset('03');go('08')}],
 ['C2','OTP / payment','09 or 10 → 06',()=>{reset('03');go('09')}],
 ['D','Check a number','11 → loading → result',()=>{reset('03');go('11')}],
 ['E','Warn family / SOS','14 → 15 → confirm → sent',()=>{reset('03');go('14')}],
 ['F','Tips & settings','12 · 13 · language',()=>{reset('03');go('13')}],
 ['G','Log in (mobile + OTP)','01c → sheet → OTP → 02',()=>{reset('01c');S.agree=true;render()}],
 ['G2','Skipped login','Settings → log in → OTP',()=>{reset('03');go('13')}]
];
function startCall(k){go('05');const i=CALLSEQ.findIndex(e=>e.k===k);S.call.pos=null;S.call.t=CALLSEQ[i].at;CALLSEQ.slice(0,i+1).forEach(e=>S.call.fired[e.k]=true);S.call.active=k;render()}
setInterval(()=>{if(S.scr!=='05'||S.ov)return;const c=S.call;c.t++;const el=document.getElementById('calltimer');if(el)el.textContent=fmtCall(c.t);
 if(!c.active){const nx=CALLSEQ.find(e=>!c.fired[e.k]&&c.t>=e.at);if(nx){c.fired[nx.k]=true;c.active=nx.k;c.pos=null;render(true)}}},1000);
(function(){
 let d=null;
 const dis=(dir)=>{ // fling off-screen then close
  const el=d.el,w=d.pw;el.style.transition='transform .22s ease-in,opacity .22s';
  const x=dir==='l'?-w:dir==='r'?w:d.x,y=dir==='t'?-420:d.y;
  el.style.transform=`translate(${x}px,${y}px)`;el.style.opacity='0';
  setTimeout(()=>{S.call.active=null;S.call.pos=null;render(true)},220)};
 document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('.pop .glass');if(!g||e.target.closest('button'))return;
  const el=g.parentElement,par=el.offsetParent||el.parentElement,pr=par.getBoundingClientRect(),er=el.getBoundingClientRect();
  const sc=pr.width/par.offsetWidth||1,pos=S.call.pos||{x:0,y:0};
  d={el,g,sx:e.clientX,sy:e.clientY,bx:pos.x,by:pos.y,x:pos.x,y:pos.y,sc,pw:par.offsetWidth,ph:par.offsetHeight,h:el.offsetHeight,top:el.offsetTop,t:performance.now(),vx:0,vy:0,lx:e.clientX,ly:e.clientY,lt:performance.now()};
  el.classList.add('drag');el.style.transition='none';try{g.setPointerCapture(e.pointerId)}catch(_){}
 });
 document.addEventListener('pointermove',e=>{
  if(!d)return;const now=performance.now(),dt=Math.max(1,now-d.lt);
  d.vx=(e.clientX-d.lx)/dt/d.sc;d.vy=(e.clientY-d.ly)/dt/d.sc;d.lx=e.clientX;d.ly=e.clientY;d.lt=now;
  d.x=d.bx+(e.clientX-d.sx)/d.sc;d.y=d.by+(e.clientY-d.sy)/d.sc;
  d.y=Math.min(d.y,d.ph-d.h-d.top-24); // keep above the bottom edge
  d.el.style.transform=`translate(${d.x}px,${d.y}px)`;
  const out=Math.max(Math.abs(d.x)/(d.pw*.34),(-d.y)/110);
  d.el.style.opacity=String(Math.max(.35,1-Math.max(0,out-.4)*.6));
 });
 const end=()=>{
  if(!d)return;d.el.classList.remove('drag');
  const L_=d.x<-d.pw*.34||(d.vx<-.7&&d.x<-30),R_=d.x>d.pw*.34||(d.vx>.7&&d.x>30),T_=d.y<-110||(d.vy<-.7&&d.y<-40);
  if(L_||R_||T_){dis(T_&&!L_&&!R_?'t':L_?'l':'r');d=null;return}
  d.el.style.transition='opacity .15s';d.el.style.opacity='1';S.call.pos={x:d.x,y:d.y};d=null;
 };
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();
function reset(to){
 Object.assign(S,{sosTo:'family',callLight:false,call:{t:0,fired:{},active:null},uname:'',nameDraft:'',stack:[],ov:null,toast:null,filter:'All',inc:'call',blocked:{},num:'',numState:'empty',sample:null,sosFail:false,editing:false,rec:{'Asha Mehta':true,'Ravi Mehta':true},loc:false,msg:'Call me and help.',sosMode:'sos',tip:0,inv:{name:'',num:'',tag:''},agree:false,user:null,login:{step:'phone',num:'',otp:'',err:null,loading:false,from:'onboarding',t:30,sms:false,shown:false},contacts:defContacts(),feed:'all',allAlerts:false,q:0,qa:null,qs:0,perm:{calls:false,shared:false,notif:false},set:{call:false,link:false,otp:false,pay:true,notif:false,community:false}});
 S.scr=to||'01';render();
}
function rail(){
 const r=document.getElementById('rail');
 r.innerHTML=`<h1>${logo(52)}</h1><p class="sub">Interactive prototype · 16 screens. Click inside the phone like a real app. Sample data only.</p>
 <div class="lang" role="group" aria-label="Language"><button class="${S.lang==='en'?'on':''}" data-r="en">English</button><button class="${S.lang==='hi'?'on':''}" data-r="hi">हिन्दी</button></div>
 <h2>Journeys</h2>${JOUR.map((j,i)=>`<button class="jb" data-j="${i}"><b>${j[0]} · ${j[1]}</b><span>${j[2]}</span></button>`).join('')}
 <h2>Jump to screen</h2><div class="screens">${Object.keys(NAMES).map(k=>`<button class="${S.scr===k?'on':''}" data-s="${k}">${k} ${NAMES[k]}</button>`).join('')}</div>
 <button class="restart" data-r="reset">${ic('refresh-cw',18)}Restart prototype</button>`;
}
document.getElementById('rail').addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.j!==undefined)JOUR[+t.dataset.j][3]();
 else if(t.dataset.s){S.stack=[];S.ov=null;if(t.dataset.s==='06')S.inc='call';if(t.dataset.s==='15'){S.sosMode='sos';S.sosTo='family'}go(t.dataset.s)}
 else if(t.dataset.r==='reset')reset();
 else if(t.dataset.r){S.lang=t.dataset.r;render(true)}
});

function fit(){const sc=document.getElementById('scaler'),st=document.getElementById('stage');const s=Math.min(1,(st.clientHeight-24)/912,(st.clientWidth-24)/432);sc.style.transform=`scale(${s})`;sc.style.margin=`${-(912*(1-s))/2}px ${-(432*(1-s))/2}px`}
window.addEventListener('resize',fit);
render();fit();
