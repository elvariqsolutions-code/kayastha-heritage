<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        .font-noto-serif { font-family: 'Noto Serif', serif; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .glass-nav {
            background-color: rgba(255, 248, 239, 0.8);
            backdrop-filter: blur(12px);
        }
        .hero-gradient {
            background: linear-gradient(135deg, #a04100 0%, #ff9762 100%);
        }
    </style>

<body>

  <div id="header"></div>

  <main id="content"></main>

  <div id="footer"></div>
  <button class="fixed bottom-8 right-8 w-14 h-14 rounded-full hero-gradient text-on-primary shadow-2xl flex items-center justify-center hover:scale-110 transition-transform z-40 group">
<span class="material-symbols-outlined text-3xl">add</span>
<span class="absolute right-16 bg-white text-primary font-bold px-3 py-1 rounded shadow-sm whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity">Submit Heritage Entry</span>
</button>

  <script src="js/app.js"></script>
